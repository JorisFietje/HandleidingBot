<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandleidingChat</title>
  <link rel="icon" href="/metesco-favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <div class="layout">

    <!-- Zijbalk: geschiedenis -->
    <aside class="zijbalk" id="zijbalk">
      <div class="zijbalk-header">
        <span class="zijbalk-titel">Gesprekken</span>
        <button class="zijbalk-knop" onclick="toggleZijbalk()" title="Zijbalk inklappen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
      </div>
      <div class="sessie-lijst" id="sessieLijst"></div>
      <div class="zijbalk-footer">
        <button class="zijbalk-nieuw-knop" onclick="nieuwGesprek()" title="Nieuw gesprek">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nieuw gesprek
        </button>
      </div>
    </aside>

    <!-- Hoofdgebied -->
    <div class="hoofd">

      <!-- Header -->
      <header class="header">
        <button class="menu-knop" id="menuKnop" onclick="toggleZijbalk()" title="Zijbalk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18">
            <path d="M15 18l-6-6 6-6"/>
          </svg>
        </button>
        <div class="header-info">
          <span class="header-titel">HandleidingChat</span>
          <span class="header-subtitel">078 651 11 17 &nbsp;|&nbsp; info@metesco.nl</span>
        </div>
        <a class="admin-knop" href="/admin" title="Admin – LLM instellingen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Admin</span>
        </a>
      </header>

      <!-- Chat berichten -->
      <main class="chat-venster" id="chatVenster">
        <div class="welkom-bericht">
          <div class="welkom-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="32" height="32">
              <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
          </div>
          <h2>Welkom bij HandleidingChat</h2>
          <p>Uw digitale handleiding-assistent van Metesco.</p>
        </div>
      </main>

      <!-- Invoerbalk -->
      <footer class="invoer-balk">
        <div class="invoer-inner">
          <div class="invoer-wrapper">
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
            <textarea
              id="invoerVeld"
              placeholder="Stel een vraag..."
              autocomplete="off"
              rows="1"
              onkeydown="behandelInvoerToets(event)"
            ></textarea>
          </div>
          <button id="verstuurKnop" onclick="verstuurBericht()" aria-label="Versturen">
            <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </footer>

    </div>
  </div>

  <script src="/static/script.js?v=19"></script>
</body>
</html>
